<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin library access — What It Paid</title>
</head>
<body style="margin:0;padding:40px 20px;background:#1a1713;font-family:sans-serif;text-align:center;">
<div style="max-width:480px;margin:0 auto;">
<p style="font-size:28px;color:#f4efe3;margin-bottom:16px;">What It Paid</p>
<p style="font-size:18px;color:#f4efe3;">Admin library access</p>
<p style="color:#a8a094;line-height:1.6;">Enter the admin email address and a fresh library link will be sent to it. The admin library holds every Receipt — no checkout, everything else identical to the customer's.</p>
<form id="resend-form" style="margin-top:24px;">
<input type="email" name="email" required placeholder="you@example.com" style="padding:12px 16px;border-radius:10px;border:0;font-size:16px;width:70%;max-width:300px;"><br>
<button type="submit" style="margin-top:14px;padding:12px 28px;border-radius:10px;border:0;background:#35a852;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">Email me my library link</button>
</form>
<p id="resend-msg" style="color:#35a852;margin-top:16px;"></p>
<p style="margin-top:32px;"><a href="https://whatitpaid.com" style="color:#35a852;">Back to whatitpaid.com</a></p>
</div>
<script>
document.getElementById("resend-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = new FormData(e.target).get("email");
  try {
    await fetch("/api/magic-link/resend", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email }) });
  } catch (_) {}
  document.getElementById("resend-msg").textContent = "If this email has admin access, a new link is on its way.";
});
</script>
</body>
</html>
